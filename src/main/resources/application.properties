spring.application.name=nequi-franchises

spring.mongodb.protocol=mongodb+srv
spring.mongodb.host=${MONGODB_HOST}
spring.mongodb.database=nequi_franchises
spring.mongodb.username=${MONGODB_USERNAME}
spring.mongodb.password=${MONGODB_PASSWORD}
spring.mongodb.authentication-database=admin
spring.mongodb.ssl.enabled=true
spring.mongodb.representation.uuid=standard